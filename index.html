<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>个人工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0F17'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%2322D3EE' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="#101827"/><path d="M9 17l5 5 9-11" stroke="#22D3EE" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">个人工作台</span>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button id="syncChip" class="sync-chip" type="button" title="同步状态，点击进入设置"></button>
    </div>
  </aside>

  <main id="main">
    <header id="mobile-top">
      <span class="brand-logo">
        <svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="8" fill="#101827"/><path d="M9 17l5 5 9-11" stroke="#22D3EE" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">个人工作台</span>
      <button id="syncChipM" class="sync-chip" type="button" title="同步状态"></button>
    </header>
    <div id="view"></div>
  </main>

  <nav id="tabbar"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/app.js"></script>
<script>
// 注册 Service Worker：注册成功后本应用可离线打开、可安装为 APP
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 离线能力不可用时静默跳过 */ });
  });
}
</script>
</body>
</html>
